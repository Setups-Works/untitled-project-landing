name: Deploy web app to Azure

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "scripts/**"
      - "db/migrations/**"
      - "Dockerfile"
      - ".dockerignore"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "apps/mobile/package.json"
      - "apps/web/package.json"
      - "next.config.mjs"
      - "turbo.json"
      - "tsconfig*.json"
      - "*.config.*"
      - ".github/workflows/deploy-azure-docker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-webapp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build, publish, and deploy container
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            nitheeshdr/untitled-workspace:${{ github.sha }}
            nitheeshdr/untitled-workspace:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy image to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: untitled-ws-nitheesh-13oct26
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: nitheeshdr/untitled-workspace:${{ github.sha }}
