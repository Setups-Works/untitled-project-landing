name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the design check diffs against the base branch

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Design language and hard-coding check
        if: github.event_name == 'pull_request'
        run: node scripts/check-design.mjs --base origin/${{ github.base_ref }}

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          # The app must build (and show its setup notice) without any secrets.
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Guard against committed secrets
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '^\.env(\.[a-z]+)?\.example$'; then
            echo "A .env file is tracked by git. Remove it and rotate any keys it contained."; exit 1
          fi
          if git grep -nE 'eyJhbGciOi[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}' -- . ; then
            echo "Something that looks like a JWT/API key is committed. Remove it and rotate it."; exit 1
          fi
